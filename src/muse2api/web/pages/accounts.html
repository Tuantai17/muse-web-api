<!-- Page: Accounts -->
<section class="page" id="page-accounts" hidden>
  <!-- Page Header Row -->
  <div class="page-title-row">
    <div class="page-title-left">
      <h1 class="page-title">Tài khoản Muse</h1>
      <p class="page-subtitle">Quản lý các phiên Muse thuộc không gian của bạn.</p>
    </div>
    <div class="page-title-right">
      <button class="btn primary add-account-btn" id="acc-new" type="button">
        <span class="plus-symbol">+</span> Thêm tài khoản
      </button>
      <button class="btn" id="acc-refresh" type="button" hidden></button>
    </div>
  </div>

  <!-- Security Notice Banner -->
  <div class="notice-banner">
    <div class="notice-icon-circle">
      <svg class="i"><use href="#i-shield-check"/></svg>
    </div>
    <div class="notice-body">
      <div class="notice-title">Tài khoản riêng, quyền truy cập riêng.</div>
      <div class="notice-desc">Chỉ API key của bạn gọi được các tài khoản này. Luân chuyển và thử lại luôn nằm trong kho của bạn.</div>
      <div class="notice-sub">Tự cập nhật trạng thái và token mỗi 1 phút khi mở trang.</div>
    </div>
  </div>

  <!-- Accounts Table Container -->
  <div id="accounts"></div>
</section>
