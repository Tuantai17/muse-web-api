<header class="topbar">
  <div class="topbar-left">
    <button type="button" class="burger" id="burger" aria-label="Mở menu" aria-controls="side" aria-expanded="false">
      <svg class="i"><use href="#i-menu"/></svg>
    </button>
    <div class="breadcrumb" id="top-breadcrumb">
      <svg class="i breadcrumb-icon"><use href="#i-home"/></svg>
      <span class="breadcrumb-text" id="top-title">Tổng quan</span>
    </div>
  </div>

  <div class="topbar-right">
    <div class="topbar-search">
      <svg class="i search-icon"><use href="#i-search"/></svg>
      <input type="text" id="global-search" placeholder="Tìm kiếm..." autocomplete="off" spellcheck="false">
      <kbd class="search-kbd">Ctrl K</kbd>
    </div>

    <button type="button" class="topbar-icon-btn" id="notif-btn" aria-label="Thông báo">
      <svg class="i"><use href="#i-bell"/></svg>
      <span class="notif-dot" aria-hidden="true"></span>
    </button>

    <div class="topbar-user" title="Admin">
      <div class="user-avatar-circle">N</div>
    </div>
  </div>
</header>
