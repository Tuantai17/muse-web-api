<div class="app" id="app" hidden>
  <aside class="side" id="side" aria-label="Điều hướng">
    <!-- Brand / Logo Header -->
    <div class="wordmark">
      <img class="logo-avatar" src="/logo.webp" alt="muse-web-api logo">
      <div class="wordmark-text">
        <span class="wordmark-title">muse-web-api</span>
        <small id="version">v0.2.0 · browser</small>
      </div>
    </div>

    <!-- Navigation Menu -->
    <nav>
      <div class="navlabel">QUẢN LÝ</div>
      <a href="#overview" data-page="overview" class="nav-item">
        <svg class="i"><use href="#i-overview"/></svg>
        <span>Tổng quan</span>
      </a>
      <a href="#accounts" data-page="accounts" class="nav-item">
        <svg class="i"><use href="#i-accounts"/></svg>
        <span>Accounts</span>
        <span class="count" id="nav-accounts">1</span>
      </a>
      <a href="#keys" data-page="keys" class="nav-item">
        <svg class="i"><use href="#i-keys"/></svg>
        <span>API Keys</span>
        <span class="count" id="nav-keys">1</span>
      </a>
      <a href="#requests" data-page="requests" class="nav-item">
        <svg class="i"><use href="#i-requests"/></svg>
        <span>Requests</span>
      </a>
    </nav>

    <!-- Sidebar Bottom / Footer -->
    <div class="side-foot">
      <!-- 2-State Theme Toggle (Light / Dark) -->
      <div class="themes" role="group" aria-label="Giao diện">
        <button type="button" data-theme="light" title="Giao diện sáng" aria-label="Sáng">
          <svg class="i"><use href="#i-sun"/></svg>
        </button>
        <button type="button" data-theme="dark" title="Giao diện tối" aria-label="Tối">
          <svg class="i"><use href="#i-moon"/></svg>
        </button>
      </div>

      <!-- Admin User Card -->
      <div class="side-user-card">
        <img class="side-user-avatar" src="/logo.webp" alt="Admin Avatar">
        <div class="side-user-info">
          <div class="side-user-name">Admin</div>
          <div class="side-user-role">Quản trị viên</div>
        </div>
      </div>

      <!-- Logout Button -->
      <button type="button" class="logout" id="signout">
        <svg class="i"><use href="#i-logout"/></svg>
        <span>Đăng xuất</span>
      </button>
    </div>

    <!-- Organic decorative background waves in bottom-left corner -->
    <svg class="side-wave-decor" viewBox="0 0 240 260" preserveAspectRatio="none" aria-hidden="true">
      <path d="M-20 280 C60 220, 40 140, -10 90 C-40 60, -30 20, -40 0 L-40 280 Z" fill="rgba(11, 107, 97, 0.15)"/>
      <path d="M-20 280 C100 240, 80 160, 20 120 C-20 80, -10 40, -20 10 L-20 280 Z" fill="rgba(16, 185, 129, 0.08)"/>
      <path d="M-10 280 C140 250, 110 180, 50 140 C0 100, 20 50, 0 30 L0 280 Z" fill="rgba(63, 209, 189, 0.05)"/>
    </svg>
  </aside>
  <div class="scrim" id="scrim"></div>
